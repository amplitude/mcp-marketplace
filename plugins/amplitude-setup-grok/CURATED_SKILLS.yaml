# Canonical setup-bot skills live under plugins/amplitude/skills/.
# This adapter does not copy them — eng can wire paths at Grok packaging time.
# See README.md for install options (dual plugin vs monorepo bundle).

plugin_root: ../amplitude

skills:
  - id: getting-started-with-amplitude
    path: skills/getting-started-with-amplitude
    location: adapter
    role: First-run onboarding for Grok Bot (this plugin only)

  - id: add-analytics-instrumentation
    path: skills/add-analytics-instrumentation
    location: canonical
    role: End-to-end instrumentation orchestrator

  - id: diff-intake
    path: skills/diff-intake
    location: canonical
    role: PR/branch change brief for instrumentation pipeline

  - id: discover-event-surfaces
    path: skills/discover-event-surfaces
    location: canonical
    role: Event candidates from a change brief

  - id: discover-analytics-patterns
    path: skills/discover-analytics-patterns
    location: canonical
    role: Repo analytics conventions before adding events

  - id: instrument-events
    path: skills/instrument-events
    location: canonical
    role: Line-level instrumentation plan from prioritized events

  - id: taxonomy
    path: skills/taxonomy
    location: canonical
    role: Naming, governance, and tracking-plan quality

  - id: tracking-plan-audit
    path: skills/tracking-plan-audit
    location: canonical
    role: Evidence-backed deletion / cleanup audits

  - id: create-chart
    path: skills/create-chart
    location: canonical
    role: Chart creation after instrumentation validation

  - id: create-dashboard
    path: skills/create-dashboard
    location: canonical
    role: Dashboard creation for setup milestones
